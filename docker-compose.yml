services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: civicmesh-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicgrid}
      POSTGRES_USER: ${POSTGRES_USER:-civicgrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicgrid}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicgrid} -d ${POSTGRES_DB:-civicgrid}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: civicmesh-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: civicmesh-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key}
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
